
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NOVA MAP V4</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#eef4ff;font:14px Arial}
header{padding:14px;background:#17243a;display:flex;justify-content:space-between;align-items:center}
header strong{font-size:19px;color:#58c8ff}
main{padding:10px}
#map{height:55vh;min-height:320px;border-radius:12px;z-index:1}
.panel{background:#1a2940;padding:12px;border-radius:12px;margin:10px 0}
button,input,select{padding:11px;border:0;border-radius:8px;margin:3px}
button{background:#1679bd;color:white;font-weight:bold}
input{max-width:100%;width:65%;background:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.grid button{width:100%}
.item{padding:9px;border-bottom:1px solid #35465e}
.small{color:#a9bdd5;font-size:12px}
h3{margin:5px 0 10px}
</style>
</head>
<body>
<header>
<strong>NOVA MAP V4</strong>
<span>MAP SYSTEM</span>
</header>
<main>
<div class="panel">
<input id="search" placeholder="Tìm địa chỉ hoặc địa điểm">
<button onclick="searchPlace()">Tìm</button>
</div>

<div id="map"></div>

<div class="panel">
<h3>Công cụ bản đồ</h3>
<div class="grid">
<button onclick="locate()">GPS của tôi</button>
<button onclick="toggleLayer()">Đổi bản đồ</button>
<button onclick="addPlace()">Đánh dấu</button>
<button onclick="measure()">Đo khoảng cách</button>
<button onclick="route()">Tạo tuyến đường</button>
<button onclick="clearMeasure()">Xóa đo đạc</button>
</div>
</div>

<div class="panel">
<h3>Điều hướng tuyến đường</h3>
<input id="destination" placeholder="Tên điểm đến">
<button onclick="routeTo()">Tìm đường</button>
<p id="routeInfo" class="small">Chưa có tuyến đường.</p>
</div>

<div class="panel">
<h3>Địa điểm đã lưu</h3>
<div id="places"></div>
</div>

<div class="panel">
<h3>Theo dõi hành trình GPS</h3>
<button onclick="startTrack()">Bắt đầu</button>
<button onclick="stopTrack()">Dừng</button>
<button onclick="exportTrack()">Xuất hành trình</button>
<p id="gpsInfo" class="small">GPS chưa hoạt động.</p>
</div>

<div class="panel">
<h3>Quản lý dữ liệu</h3>
<button onclick="exportData()">Xuất dữ liệu JSON</button>
<button onclick="document.getElementById('importFile').click()">Nhập dữ liệu</button>
<input type="file" id="importFile" accept=".json,.geojson" hidden onchange="importData(event)">
<button onclick="clearPlaces()">Xóa địa điểm</button>
</div>

<div class="panel">
<h3>Trạng thái hệ thống</h3>
<p id="status" class="small">NOVA MAP V4 sẵn sàng.</p>
</div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([16.047,108.206],6);
const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'});
let satelliteOn=false;
let places=JSON.parse(localStorage.getItem('nova_places')||'[]');
let markers=[],measurePoints=[],measureLine=null,routeLine=null;
let tracking=false,watchId=null,track=[],trackLine=null;

function status(s){document.getElementById('status').textContent=s}
function save(){localStorage.setItem('nova_places',JSON.stringify(places));renderPlaces()}
function toggleLayer(){
if(satelliteOn){map.removeLayer(satellite);street.addTo(map)}
else{map.removeLayer(street);satellite.addTo(map)}
satelliteOn=!satelliteOn;
}
function locate(){
if(!navigator.geolocation)return status('Thiết bị không hỗ trợ GPS');
navigator.geolocation.getCurrentPosition(p=>{
let lat=p.coords.latitude,lon=p.coords.longitude;
map.setView([lat,lon],16);
L.marker([lat,lon]).addTo(map).bindPopup('Vị trí hiện tại').openPopup();
status('GPS: '+lat.toFixed(6)+', '+lon.toFixed(6));
},e=>status('Không lấy được GPS: '+e.message),{enableHighAccuracy:true});
}
async function searchPlace(){
let q=document.getElementById('search').value.trim();
if(!q)return;
status('Đang tìm kiếm...');
try{
let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&q='+encodeURIComponent(q));
let d=await r.json();
if(!d.length)return status('Không tìm thấy địa điểm');
let x=d[0];map.setView([+x.lat,+x.lon],15);
L.marker([+x.lat,+x.lon]).addTo(map).bindPopup(x.display_name).openPopup();
status('Đã tìm thấy: '+x.display_name);
}catch(e){status('Lỗi tìm kiếm: '+e.message)}
}
function addPlace(){
let c=map.getCenter(),name=prompt('Tên địa điểm:');
if(!name)return;
places.push({name,lat:c.lat,lon:c.lng});
save();L.marker([c.lat,c.lng]).addTo(map).bindPopup(name);
status('Đã lưu địa điểm');
}
function renderPlaces(){
document.getElementById('places').innerHTML='';
places.forEach((p,i)=>{
let d=document.createElement('div');d.className='item';
let t=document.createElement('span');t.textContent=p.name+' ('+p.lat.toFixed(4)+', '+p.lon.toFixed(4)+') ';
let b=document.createElement('button');b.textContent='Mở';
b.onclick=()=>{map.setView([p.lat,p.lon],16);L.popup().setLatLng([p.lat,p.lon]).setContent(p.name).openOn(map)};
let del=document.createElement('button');del.textContent='Xóa';
del.onclick=()=>{places.splice(i,1);save()};
d.append(t,b,del);document.getElementById('places').appendChild(d);
});
}
function measure(){
map.once('click',e=>{
measurePoints.push(e.latlng);
if(measureLine)map.removeLayer(measureLine);
measureLine=L.polyline(measurePoints,{color:'orange'}).addTo(map);
if(measurePoints.length>1){
let total=0;
for(let i=1;i<measurePoints.length;i++)total+=map.distance(measurePoints[i-1],measurePoints[i]);
status('Khoảng cách: '+(total/1000).toFixed(3)+' km');
}else status('Đã chọn điểm đầu. Tiếp tục chạm bản đồ.');
});
status('Chạm bản đồ để chọn các điểm đo');
}
function clearMeasure(){
measurePoints=[];if(measureLine)map.removeLayer(measureLine);
measureLine=null;status('Đã xóa phép đo');
}
async function route(){
let a=map.getCenter();
let b=prompt('Nhập tọa độ đích dạng vĩ độ, kinh độ');
if(!b)return;
let parts=b.split(',').map(Number);
if(parts.length!==2||parts.some(n=>!Number.isFinite(n)))return alert('Tọa độ không hợp lệ');
await makeRoute(a,{lat:parts[0],lng:parts[1]});
}
async function routeTo(){
let q=document.getElementById('destination').value.trim();if(!q)return;
try{
let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));
let d=await r.json();if(!d.length)return status('Không tìm thấy điểm đến');
await makeRoute(map.getCenter(),{lat:+d[0].lat,lng:+d[0].lon});
}catch(e){status('Không tìm được điểm đến')}
}
async function makeRoute(a,b){
try{
status('Đang tính tuyến đường...');
let url=`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;
let r=await fetch(url),d=await r.json();
if(!d.routes?.length)return status('Không có tuyến đường');
if(routeLine)map.removeLayer(routeLine);
let coords=d.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
routeLine=L.polyline(coords,{color:'#21d4fd',weight:5}).addTo(map);
map.fitBounds(routeLine.getBounds());
document.getElementById('routeInfo').textContent='Khoảng cách: '+(d.routes[0].distance/1000).toFixed(2)+' km | Thời gian ước tính: '+Math.round(d.routes[0].duration/60)+' phút';
status('Đã tạo tuyến đường');
}catch(e){status('Lỗi định tuyến: '+e.message)}
}
function startTrack(){
if(tracking)return;
if(!navigator.geolocation)return status('Không hỗ trợ GPS');
tracking=true;track=[];
watchId=navigator.geolocation.watchPosition(p=>{
let pt=[p.coords.latitude,p.coords.longitude];track.push(pt);
if(trackLine)map.removeLayer(trackLine);
trackLine=L.polyline(track,{color:'red',weight:4}).addTo(map);
map.setView(pt,16);
document.getElementById('gpsInfo').textContent='Đang theo dõi: '+pt.join(', ')+' | '+track.length+' điểm';
},e=>status('Lỗi GPS: '+e.message),{enableHighAccuracy:true,maximumAge:1000});
status('Đã bắt đầu theo dõi GPS');
}
function stopTrack(){
tracking=false;if(watchId!==null)navigator.geolocation.clearWatch(watchId);
watchId=null;status('Đã dừng theo dõi. Số điểm: '+track.length);
}
function download(name,data){
let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);
}
function exportData(){download('nova-map-data.json',{places,track})}
function exportTrack(){download('nova-map-track.geojson',{type:'Feature',geometry:{type:'LineString',coordinates:track.map(p=>[p[1],p[0]])},properties:{name:'NOVA MAP Track'}})}
function importData(e){
let f=e.target.files[0];if(!f)return;
let reader=new FileReader();
reader.onload=()=>{
try{let d=JSON.parse(reader.result);if(!Array.isArray(d.places))throw Error('Thiếu dữ liệu địa điểm');
places=d.places;save();status('Đã nhập dữ liệu')}
catch(err){status('File không hợp lệ: '+err.message)}
};reader.readAsText(f);
}
function clearPlaces(){if(confirm('Xóa tất cả địa điểm đã lưu?')){places=[];save();status('Đã xóa địa điểm')}}
renderPlaces();
</script>
</body>
</html>
