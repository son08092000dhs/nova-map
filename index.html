
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA MAP V2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#edf4ff;font:14px Arial,sans-serif}
header{padding:14px;background:#111d31;border-bottom:1px solid #263750}
h2{margin:0 0 5px;color:#54c8ff}
small{color:#9fb3cc}
.toolbar{display:flex;gap:7px;padding:10px;flex-wrap:wrap;background:#111d31}
button,input{border:1px solid #344761;border-radius:8px;padding:10px;background:#1b2b42;color:white}
button{cursor:pointer}
button:active{background:#087eb8}
input{min-width:0;flex:1}
#search{display:flex;gap:7px;padding:10px}
#map{height:58vh;min-height:350px;width:100%;background:#17253a}
.panel{padding:12px;background:#111d31}
#status{color:#61d7a5;margin-top:8px;min-height:18px}
#saved{font-size:13px;color:#c3d4e8;line-height:1.8}
footer{padding:12px;text-align:center;color:#8195ad;font-size:12px}
</style>
</head>
<body>
<header>
<h2>NOVA MAP V2</h2>
<small>Geographic Explorer · Mapping · Discovery</small>
</header>

<div id="search">
<input id="query" placeholder="Tìm địa điểm, thành phố, quốc gia...">
<button onclick="searchPlace()">Tìm</button>
</div>

<div class="toolbar">
<button onclick="locate()">Vị trí GPS</button>
<button onclick="switchLayer()">Ảnh vệ tinh</button>
<button onclick="addMarker()">Đánh dấu</button>
<button onclick="toggleMeasure()">Đo khoảng cách</button>
<button onclick="clearMeasure()">Xóa đo</button>
</div>

<div id="map"></div>

<div class="panel">
<strong>NOVA MAP CONTROL</strong>
<div id="status">Đang khởi tạo bản đồ...</div>
<p>Điểm đã lưu:</p>
<div id="saved">Chưa có điểm nào.</div>
<div class="toolbar" style="padding:8px 0">
<button onclick="exportData()">Xuất GeoJSON</button>
<button onclick="clearMarkers()">Xóa điểm</button>
</div>
</div>

<footer>
NOVA MAP V2 · OpenStreetMap · Leaflet · Dữ liệu bản đồ bên thứ ba
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([16.0471,108.2068],5);

const street=L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{maxZoom:19,attribution:'© OpenStreetMap contributors'}
);

const satellite=L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{maxZoom:19,attribution:'Tiles © Esri'}
);

street.addTo(map);
let satelliteMode=false;
let markers=[];
let measuring=false;
let measurePoints=[];
let measureLine=null;

function status(message){
document.getElementById('status').textContent=message;
}

function switchLayer(){
if(satelliteMode){
map.removeLayer(satellite);
street.addTo(map);
}else{
map.removeLayer(street);
satellite.addTo(map);
}
satelliteMode=!satelliteMode;
status(satelliteMode?'Đang xem ảnh vệ tinh.':'Đang xem bản đồ đường phố.');
}

function locate(){
if(!navigator.geolocation){
status('Trình duyệt không hỗ trợ GPS.');
return;
}
status('Đang xác định vị trí...');
navigator.geolocation.getCurrentPosition(
p=>{
const lat=p.coords.latitude;
const lng=p.coords.longitude;
map.setView([lat,lng],16);
L.marker([lat,lng]).addTo(map)
.bindPopup('Vị trí hiện tại của bạn').openPopup();
status('Đã xác định vị trí GPS.');
},
e=>status('Không lấy được vị trí. Hãy cấp quyền GPS cho trình duyệt.'),
{enableHighAccuracy:true,timeout:15000}
);
}

async function searchPlace(){
const q=document.getElementById('query').value.trim();
if(!q){status('Nhập địa điểm cần tìm.');return;}
status('Đang tìm kiếm...');
try{
const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q='+encodeURIComponent(q);
const response=await fetch(url);
if(!response.ok)throw new Error('Search failed');
const data=await response.json();
if(!data.length){status('Không tìm thấy địa điểm.');return;}
const p=data[0];
const lat=Number(p.lat),lng=Number(p.lon);
map.setView([lat,lng],14);
L.marker([lat,lng]).addTo(map)
.bindPopup(p.display_name).openPopup();
status('Đã tìm thấy: '+p.display_name);
}catch(e){
status('Tìm kiếm thất bại. Kiểm tra kết nối Internet và thử lại.');
}
}

function addMarker(){
const c=map.getCenter();
saveMarker(c.lat,c.lng);
}

function saveMarker(lat,lng){
const marker=L.marker([lat,lng]).addTo(map);
const name='Điểm '+(markers.length+1);
marker.bindPopup(name+'<br>'+lat.toFixed(6)+', '+lng.toFixed(6));
markers.push({lat,lng,name,layer:marker});
updateSaved();
status('Đã lưu vị trí đánh dấu.');
}

function updateSaved(){
const box=document.getElementById('saved');
if(!markers.length){box.textContent='Chưa có điểm nào.';return;}
box.innerHTML='';
markers.forEach((m,i)=>{
const row=document.createElement('div');
row.textContent=(i+1)+'. '+m.name+' — '+m.lat.toFixed(4)+', '+m.lng.toFixed(4);
box.appendChild(row);
});
}

function clearMarkers(){
markers.forEach(m=>map.removeLayer(m.layer));
markers=[];
updateSaved();
status('Đã xóa các điểm đánh dấu.');
}

function toggleMeasure(){
measuring=!measuring;
measurePoints=[];
if(measureLine){map.removeLayer(measureLine);measureLine=null;}
status(measuring?'Chế độ đo: chạm các điểm trên bản đồ.':'Đã tắt chế độ đo.');
}

function clearMeasure(){
measurePoints=[];
if(measureLine){map.removeLayer(measureLine);measureLine=null;}
status('Đã xóa đường đo.');
}

map.on('click',e=>{
if(!measuring)return;
measurePoints.push(e.latlng);
if(measureLine)map.removeLayer(measureLine);
measureLine=L.polyline(measurePoints,{color:'#00d5ff',weight:4}).addTo(map);
if(measurePoints.length>=2){
let distance=0;
for(let i=1;i<measurePoints.length;i++){
distance+=measurePoints[i-1].distanceTo(measurePoints[i]);
}
status('Khoảng cách: '+(distance>=1000?(distance/1000).toFixed(3)+' km':distance.toFixed(1)+' m'));
}else{
status('Đã chọn điểm đầu tiên. Chọn điểm tiếp theo.');
}
});

function exportData(){
const features=markers.map(m=>({
type:'Feature',
properties:{name:m.name},
geometry:{type:'Point',coordinates:[m.lng,m.lat]}
}));
const geojson={
type:'FeatureCollection',
features
};
const blob=new Blob([JSON.stringify(geojson,null,2)],{type:'application/geo+json'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;
a.download='nova-map-data.geojson';
a.click();
URL.revokeObjectURL(url);
status('Đã xuất dữ liệu GeoJSON.');
}

document.getElementById('query').addEventListener('keydown',e=>{
if(e.key==='Enter')searchPlace();
});

status('NOVA MAP V2 đã sẵn sàng.');
</script>
</body>
</html>
