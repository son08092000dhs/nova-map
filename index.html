
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>NOVA MAP V4.1</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root {
      color-scheme: dark;
      --bg: #101827;
      --panel: #1c293b;
      --line: #34445b;
      --text: #edf4ff;
      --muted: #9aacc3;
      --blue: #3185f5;
      --green: #19b981;
      --red: #e45c68;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    header {
      padding: 15px;
      background: #172438;
      border-bottom: 1px solid var(--line);
    }

    header strong {
      font-size: 20px;
      letter-spacing: 1px;
    }

    header small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 12px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #101827;
      color: white;
      font-size: 15px;
    }

    button {
      padding: 11px 13px;
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    button:disabled {
      opacity: .5;
    }

    button.secondary {
      background: #40516a;
    }

    button.green {
      background: #138b66;
    }

    button.red {
      background: #a83d4b;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    #map {
      width: 100%;
      height: 58vh;
      min-height: 330px;
      border-radius: 12px;
      background: #dce4eb;
      z-index: 1;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .place {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      padding: 9px 0;
      font-size: 13px;
    }

    .place:last-child {
      border-bottom: 0;
    }

    .place span {
      overflow-wrap: anywhere;
    }

    .place button {
      padding: 7px 9px;
      flex-shrink: 0;
    }

    .info {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      color: var(--muted);
      padding: 15px;
      font-size: 12px;
    }

    @media (min-width: 700px) {
      .tools {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <header>
    <strong>NOVA MAP V4.1</strong>
    <small>Navigation · GPS · Route · Tracking · Data</small>
  </header>

  <main>
    <section class="panel">
      <div class="search-row">
        <input id="search" type="search"
          placeholder="Nhập địa điểm cần tìm...">
        <button id="searchBtn">Tìm</button>
      </div>
    </section>

    <section class="panel">
      <div class="section-title">Bản đồ</div>
      <div id="map"></div>
      <p id="status" class="status">Đang khởi tạo bản đồ...</p>
    </section>

    <section class="panel">
      <div class="section-title">Công cụ bản đồ</div>
      <div class="tools">
        <button id="gpsBtn" class="green">GPS của tôi</button>
        <button id="layerBtn" class="secondary">Đổi bản đồ</button>
        <button id="markBtn">Đánh dấu</button>
        <button id="measureBtn">Đo khoảng cách</button>
        <button id="clearMeasureBtn" class="secondary">Xóa phép đo</button>
        <button id="routeBtn">Tạo tuyến đường</button>
        <button id="startTrackBtn" class="green">Bắt đầu GPS Track</button>
        <button id="stopTrackBtn" class="red">Dừng GPS Track</button>
        <button id="exportTrackBtn" class="secondary">Xuất GPS Track</button>
      </div>
    </section>

    <section class="panel">
      <div class="section-title">Tìm đường đến địa điểm</div>
      <div class="search-row">
        <input id="destination"
          placeholder="Nhập địa chỉ hoặc địa điểm đích...">
        <button id="destinationBtn">Tìm đường</button>
      </div>
      <p id="routeInfo" class="info">
        Chưa có tuyến đường.
      </p>
    </section>

    <section class="panel">
      <div class="section-title">Dữ liệu địa điểm</div>
      <div id="places" class="info">Chưa có địa điểm được lưu.</div>

      <div class="tools" style="margin-top:12px">
        <button id="exportBtn" class="secondary">Xuất JSON</button>
        <button id="importBtn" class="secondary">Nhập JSON</button>
        <button id="clearBtn" class="red">Xóa địa điểm</button>
      </div>

      <input id="importFile" type="file"
        accept=".json,application/json" hidden>
    </section>

    <section class="panel">
      <div class="section-title">Thông tin GPS</div>
      <div id="gpsInfo" class="info">
        Chưa lấy vị trí GPS.
      </div>
    </section>
  </main>

  <footer>
    NOVA MAP V4.1 · Free map tools
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
  (() => {
    "use strict";

    const $ = id => document.getElementById(id);

    const status = $("status");
    const gpsInfo = $("gpsInfo");
    const routeInfo = $("routeInfo");

    let map = null;
    let baseLayers = [];
    let currentLayer = 0;

    let currentPosition = null;
    let currentMarker = null;
    let routeLayer = null;
    let measureMode = false;
    let measurePoints = [];
    let measureLine = null;

    let watchId = null;
    let trackPoints = [];
    let trackLine = null;

    let savedPlaces = loadPlaces();

    function setStatus(message) {
      status.textContent = message;
    }

    function loadPlaces() {
      try {
        const data = JSON.parse(
          localStorage.getItem("nova_map_places") || "[]"
        );
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function savePlaces() {
      localStorage.setItem(
        "nova_map_places",
        JSON.stringify(savedPlaces)
      );
      renderPlaces();
    }

    function renderPlaces() {
      const container = $("places");
      container.replaceChildren();

      if (!savedPlaces.length) {
        container.textContent = "Chưa có địa điểm được lưu.";
        return;
      }

      savedPlaces.forEach((place, index) => {
        const row = document.createElement("div");
        row.className = "place";

        const label = document.createElement("span");
        label.textContent =
          `${index + 1}. ${place.name} (${place.lat.toFixed(5)}, ${place.lng.toFixed(5)})`;

        const button = document.createElement("button");
        button.textContent = "Xem";
        button.addEventListener("click", () => {
          map.setView([place.lat, place.lng], 16);
        });

        row.append(label, button);
        container.appendChild(row);
      });
    }

    function initializeMap() {
      if (!window.L) {
        setStatus(
          "Không tải được thư viện bản đồ. Kiểm tra kết nối Internet rồi tải lại trang."
        );
        return;
      }

      map = L.map("map").setView([21.0285, 105.8542], 13);

      const street = L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,
          attribution: "&copy; OpenStreetMap"
        }
      );

      const satellite = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
          maxZoom: 19,
          attribution: "Tiles &copy; Esri"
        }
      );

      baseLayers = [street, satellite];
      street.addTo(map);

      map.on("click", handleMapClick);

      setStatus("Bản đồ đã khởi tạo. Chọn công cụ để bắt đầu.");
      renderPlaces();
    }

    function handleMapClick(event) {
      const point = event.latlng;

      if (measureMode) {
        measurePoints.push(point);

        L.circleMarker(point, {
          radius: 6,
          color: "#ffcc00"
        }).addTo(map);

        if (measurePoints.length >= 2) {
          if (measureLine) map.removeLayer(measureLine);

          measureLine = L.polyline(measurePoints, {
            color: "#ffcc00",
            weight: 4
          }).addTo(map);

          let total = 0;

          for (let i = 1; i < measurePoints.length; i++) {
            total += map.distance(
              measurePoints[i - 1],
              measurePoints[i]
            );
          }

          setStatus(
            `Khoảng cách đo được: ${formatDistance(total)}`
          );
        } else {
          setStatus("Đã chọn điểm đầu. Chọn điểm tiếp theo.");
        }
      }
    }

    function formatDistance(meters) {
      if (meters >= 1000) {
        return (meters / 1000).toFixed(2) + " km";
      }
      return meters.toFixed(1) + " m";
    }

    function setCurrentPosition(lat, lng) {
      currentPosition = { lat, lng };

      if (currentMarker) {
        map.removeLayer(currentMarker);
      }

      currentMarker = L.marker([lat, lng])
        .addTo(map)
        .bindPopup("Vị trí hiện tại")
        .openPopup();

      map.setView([lat, lng], 16);

      gpsInfo.textContent =
        `Vĩ độ: ${lat.toFixed(6)} | Kinh độ: ${lng.toFixed(6)}`;
    }

    $("gpsBtn").addEventListener("click", () => {
      if (!navigator.geolocation) {
        setStatus("Trình duyệt không hỗ trợ GPS.");
        return;
      }

      setStatus("Đang xác định vị trí...");

      navigator.geolocation.getCurrentPosition(
        position => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          setCurrentPosition(lat, lng);

          gpsInfo.textContent =
            `Vĩ độ: ${lat.toFixed(6)} | Kinh độ: ${lng.toFixed(6)} | Sai số: ${Math.round(position.coords.accuracy)} m`;

          setStatus("Đã xác định vị trí GPS.");
        },
        error => {
          setStatus("Không lấy được GPS: " + error.message);
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    });

    $("layerBtn").addEventListener("click", () => {
      if (!map) return;

      map.removeLayer(baseLayers[currentLayer]);
      currentLayer = (currentLayer + 1) % baseLayers.length;
      baseLayers[currentLayer].addTo(map);

      setStatus(
        currentLayer === 0
          ? "Đã chuyển sang bản đồ đường phố."
          : "Đã chuyển sang bản đồ vệ tinh."
      );
    });

    $("markBtn").addEventListener("click", () => {
      if (!map) return;

      const center = map.getCenter();

      const place = {
        name: "Điểm đánh dấu " + (savedPlaces.length + 1),
        lat: center.lat,
        lng: center.lng,
        createdAt: new Date().toISOString()
      };

      savedPlaces.push(place);
      savePlaces();

      L.marker([place.lat, place.lng])
        .addTo(map)
        .bindPopup(place.name);

      setStatus("Đã lưu điểm đánh dấu trên thiết bị.");
    });

    $("measureBtn").addEventListener("click", () => {
      measureMode = true;
      measurePoints = [];

      if (measureLine) {
        map.removeLayer(measureLine);
        measureLine = null;
      }

      setStatus("Chế độ đo: chạm vào các điểm trên bản đồ.");
    });

    $("clearMeasureBtn").addEventListener("click", () => {
      measureMode = false;
      measurePoints = [];

      if (measureLine) {
        map.removeLayer(measureLine);
        measureLine = null;
      }

      setStatus("Đã xóa đường đo.");
    });

    async function searchLocation(query) {
      const url =
        "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
        encodeURIComponent(query);

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("Dịch vụ tìm kiếm không phản hồi.");
      }

      const results = await response.json();

      if (!results.length) {
        throw new Error("Không tìm thấy địa điểm.");
      }

      return {
        lat: Number(results[0].lat),
        lng: Number(results[0].lon),
        name: results[0].display_name
      };
    }

    $("searchBtn").addEventListener("click", async () => {
      const query = $("search").value.trim();

      if (!query) {
        setStatus("Nhập địa điểm cần tìm.");
        return;
      }

      try {
        setStatus("Đang tìm kiếm...");
        const result = await searchLocation(query);

        map.setView([result.lat, result.lng], 16);

        L.marker([result.lat, result.lng])
          .addTo(map)
          .bindPopup(result.name)
          .openPopup();

        setStatus("Đã tìm thấy: " + result.name);
      } catch (error) {
        setStatus(error.message);
      }
    });

    $("search").addEventListener("keydown", event => {
      if (event.key === "Enter") {
        $("searchBtn").click();
      }
    });

    async function createRoute(destination) {
      if (!currentPosition) {
        throw new Error("Hãy xác định GPS của bạn trước.");
      }

      const url =
        "https://router.project-osrm.org/route/v1/driving/" +
        `${currentPosition.lng},${currentPosition.lat};` +
        `${destination.lng},${destination.lat}` +
        "?overview=full&geometries=geojson";

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("Không kết nối được dịch vụ định tuyến.");
      }

      const data = await response.json();

      if (!data.routes || !data.routes.length) {
        throw new Error("Không tìm thấy tuyến đường phù hợp.");
      }

      const route = data.routes[0];

      if (routeLayer) {
        map.removeLayer(routeLayer);
      }

      routeLayer = L.geoJSON(route.geometry, {
        style: {
          color: "#3185f5",
          weight: 5
        }
      }).addTo(map);

      map.fitBounds(routeLayer.getBounds(), {
        padding: [25, 25]
      });

      routeInfo.textContent =
        `Khoảng cách: ${formatDistance(route.distance)} · ` +
        `Thời gian ước tính: ${Math.round(route.duration / 60)} phút`;

      setStatus("Đã tạo tuyến đường.");
    }

    $("destinationBtn").addEventListener("click", async () => {
      const query = $("destination").value.trim();

      if (!query) {
        setStatus("Nhập địa điểm đích.");
        return;
      }

      try {
        setStatus("Đang tìm địa điểm đích...");
        const destination = await searchLocation(query);

        await createRoute(destination);
      } catch (error) {
        routeInfo.textContent = error.message;
        setStatus(error.message);
      }
    });

    $("routeBtn").addEventListener("click", async () => {
      if (!currentPosition) {
        setStatus("Hãy bật GPS trước khi tạo tuyến đường.");
        return;
      }

      const destination = $("destination").value.trim();

      if (!destination) {
        setStatus("Nhập địa điểm đích trong ô Tìm đường.");
        $("destination").focus();
        return;
      }

      $("destinationBtn").click();
    });

    $("startTrackBtn").addEventListener("click", () => {
      if (!navigator.geolocation) {
        setStatus("Trình duyệt không hỗ trợ GPS.");
        return;
      }

      if (watchId !== null) {
        setStatus("GPS Track đang chạy.");
        return;
      }

      trackPoints = [];

      watchId = navigator.geolocation.watchPosition(
        position => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          const point = [lat, lng];
          trackPoints.push(point);

          setCurrentPosition(lat, lng);

          if (trackLine) {
            map.removeLayer(trackLine);
          }

          if (trackPoints.length >= 2) {
            trackLine = L.polyline(trackPoints, {
              color: "#19b981",
              weight: 4
            }).addTo(map);
          }

          gpsInfo.textContent =
            `Đang theo dõi GPS · ${trackPoints.length} điểm · ` +
            `${lat.toFixed(6)}, ${lng.toFixed(6)}`;

          setStatus("GPS Track đang hoạt động.");
        },
        error => {
          setStatus("Lỗi GPS Track: " + error.message);
        },
        {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 15000
        }
      );
    });

    $("stopTrackBtn").addEventListener("click", () => {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      setStatus(
        `Đã dừng GPS Track. Tổng số điểm: ${trackPoints.length}`
      );
    });

    $("exportTrackBtn").addEventListener("click", () => {
      if (trackPoints.length < 2) {
        setStatus("Cần ít nhất hai điểm GPS để xuất Track.");
        return;
      }

      const geojson = {
        type: "Feature",
        properties: {
          name: "NOVA MAP GPS Track",
          createdAt: new Date().toISOString()
        },
        geometry: {
          type: "LineString",
          coordinates: trackPoints.map(
            point => [point[1], point[0]]
          )
        }
      };

      downloadFile(
        JSON.stringify(geojson, null, 2),
        "nova-map-track.geojson",
        "application/geo+json"
      );

      setStatus("Đã xuất GPS Track.");
    });

    $("exportBtn").addEventListener("click", () => {
      downloadFile(
        JSON.stringify(savedPlaces, null, 2),
        "nova-map-places.json",
        "application/json"
      );

      setStatus("Đã xuất dữ liệu địa điểm.");
    });

    $("importBtn").addEventListener("click", () => {
      $("importFile").click();
    });

    $("importFile").addEventListener("change", async event => {
      const file = event.target.files[0];

      if (!file) return;

      try {
        const text = await file.text();
        const data = JSON.parse(text);

        if (!Array.isArray(data)) {
          throw new Error("File JSON phải chứa một danh sách địa điểm.");
        }

        const validPlaces = data.filter(place =>
          place &&
          typeof place.lat === "number" &&
          typeof place.lng === "number" &&
          Number.isFinite(place.lat) &&
          Number.isFinite(place.lng) &&
          place.lat >= -90 &&
          place.lat <= 90 &&
          place.lng >= -180 &&
          place.lng <= 180
        );

        savedPlaces = savedPlaces.concat(validPlaces);
        savePlaces();

        setStatus(`Đã nhập ${validPlaces.length} địa điểm.`);
      } catch (error) {
        setStatus("Không thể nhập file: " + error.message);
      }

      event.target.value = "";
    });

    $("clearBtn").addEventListener("click", () => {
      if (!confirm("Bạn có chắc muốn xóa toàn bộ địa điểm đã lưu?")) {
        return;
      }

      savedPlaces = [];
      savePlaces();

      setStatus("Đã xóa dữ liệu địa điểm trên thiết bị.");
    });

    function downloadFile(content, filename, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = url;
      link.download = filename;

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    initializeMap();

  })();
  </script>
</body>
</html>
