<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10233f">
  <title>NOVA MAP V5</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">NOVA MAP <span>V5.0</span></div>
      <div class="subtitle">Geographic Intelligence Workspace</div>
    </div>
    <button id="locateBtn" class="primary">Vị trí của tôi</button>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="panel">
        <h2>Tìm địa điểm</h2>
        <form id="searchForm" class="search-row">
          <input id="searchInput" placeholder="Nhập địa điểm">
          <button class="primary">Tìm</button>
        </form>
        <p id="searchStatus" class="hint">Sẵn sàng.</p>
      </section>

      <section class="panel">
        <h2>Công cụ bản đồ</h2>
        <div class="button-grid">
          <button id="savePointBtn">Lưu điểm</button>
          <button id="distanceBtn">Đo khoảng cách</button>
          <button id="areaBtn">Đo diện tích</button>
          <button id="routeBtn">Tạo tuyến đường</button>
          <button id="clearBtn" class="danger">Xóa thao tác</button>
          <button id="exportBtn">Xuất GeoJSON</button>
        </div>
        <label class="file-label">Nhập GeoJSON
          <input id="importInput" type="file" accept=".json,.geojson">
        </label>
        <p id="toolStatus" class="hint">Chọn công cụ để bắt đầu.</p>
      </section>

      <section class="panel">
        <h2>NOVA GEO</h2>
        <p class="hint">Trợ lý địa lý theo quy tắc cục bộ.</p>
        <form id="assistantForm">
          <input id="assistantInput" placeholder="Nhập câu hỏi">
          <button class="primary full">Phân tích</button>
        </form>
        <div id="assistantOutput" class="assistant-output">
          Sẵn sàng.
        </div>
      </section>

      <section class="panel metrics">
        <h2>Thông tin bản đồ</h2>
        <div><span>Tọa độ tâm</span><strong id="centerValue">—</strong></div>
        <div><span>Thu phóng</span><strong id="zoomValue">—</strong></div>
        <div><span>Điểm đã lưu</span><strong id="savedCount">0</strong></div>
        <div><span>Kết quả đo</span><strong id="measureValue">—</strong></div>
      </section>
    </aside>

    <section class="map-wrap">
      <div id="map"></div>
      <div class="map-note">Chạm bản đồ để thao tác</div>
    </section>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>
  <script src="assets/js/app.js"></script>
</body>
</html>
